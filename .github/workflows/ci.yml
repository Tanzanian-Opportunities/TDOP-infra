name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config -q
      - name: Validate dev overrides
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
