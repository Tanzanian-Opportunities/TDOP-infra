name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  compose-validation:
    runs-on: ubuntu-latest
    env:
      # CI-only placeholders so `${VAR:?}` interpolation resolves; never real secrets.
      POSTGRES_PASSWORD: ci-placeholder-not-a-real-secret
      JWT_SECRET: ci-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config -q
      - name: Validate dev overrides
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
