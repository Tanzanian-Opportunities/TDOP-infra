name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose-validation:
    runs-on: ubuntu-latest
    env:
      # CI-only placeholders so `${VAR:?}` interpolation resolves; never real secrets.
      POSTGRES_PASSWORD: ci-placeholder-not-a-real-secret
      JWT_SECRET: ci-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config -q
      - name: Validate dev overrides
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
